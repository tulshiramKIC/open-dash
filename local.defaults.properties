# Copy required values to the gitignored local.properties file or provide them
# through Gradle/CI secrets. Never commit real project identifiers or credentials.
GOOGLE_WEB_CLIENT_ID=DEFAULT_WEB_CLIENT_ID

# Mapbox Directions API token (get one free at https://account.mapbox.com/access-tokens/).
# Put the real value in local.properties (gitignored). Routing is off when this is blank.
MAPBOX_ACCESS_TOKEN=

# Google Maps Platform key (Places API New) — https://console.cloud.google.com/apis/credentials
# Put the real value in local.properties (gitignored). Search falls back to Mapbox when blank.
GOOGLE_MAPS_API_KEY=
