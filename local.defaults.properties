# Copy required values to the gitignored local.properties file or provide them
# through Gradle/CI secrets. Never commit real project identifiers or credentials.
#
# ALL of these are OPTIONAL and can also be entered at runtime in the app under
# Settings → API Keys (no rebuild needed). Values baked in here act as defaults;
# in-app values override them. The map itself is keyless — keys only add features.

# Mapbox Directions API token (get one free at https://account.mapbox.com/access-tokens/).
# Unlocks routing fallback, waypoint stops, and place-search fallback.
MAPBOX_ACCESS_TOKEN=

# Google Maps Platform key (Routes API + Places API New) —
# https://console.cloud.google.com/apis/credentials
# Unlocks the best routing (true TWO_WHEELER profile) and primary place search.
GOOGLE_MAPS_API_KEY=

# Supabase project (free tier) — https://supabase.com → New project → Settings → API.
# Unlocks Group Ride live location sharing. The anon key is a publishable client key;
# a riding group can share one project's URL + anon key between all members.
SUPABASE_URL=
SUPABASE_ANON_KEY=
